<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giriş</title>
<!--
  Erişim listesi açıkken uygulamanın başında gösterilen giriş sayfası.
  Uygulamaya: Access.info() -> { deviceId, telegram, reason, name, expires, remaining, hasPassword }
              Access.login(sifre), Access.retry(), Access.openTelegram(), Access.sendId()
  Uygulamadan: window.onAccessResult(neden | null), window.onAccessState()
-->
<style>
  :root {
    --bg: #0b0709;
    --ink: #fbeef3;
    --muted: #b79aa6;
    --line: rgba(255, 190, 215, .16);
    --rose: #f27ba5;
    --rose-deep: #c24f78;
    --field: rgba(255, 255, 255, .06);
    --bad: #ff8a8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden auto;
  }
  /* The light that falls on the card */
  .lamp {
    position: fixed; left: 50%; top: -6vh; width: 34vmin; height: 10vmin; transform: translateX(-50%);
    border-radius: 50%; background: #fff; filter: blur(14px); opacity: .9; pointer-events: none;
    animation: flicker 7s ease-in-out infinite;
  }
  .cone {
    position: fixed; left: 50%; top: 0; width: 150vmin; height: 75vh; transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(255, 228, 238, .30), rgba(242, 123, 165, .13) 55%, transparent);
    clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
    filter: blur(22px); pointer-events: none;
    animation: flicker 7s ease-in-out infinite;
  }
  @keyframes flicker { 0%, 100% { opacity: .92; } 47% { opacity: .78; } 52% { opacity: 1; } }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  main {
    position: relative; z-index: 1; min-height: 100%;
    display: grid; place-items: center; padding: 28px 18px;
  }
  .card {
    width: 100%; max-width: 420px; padding: 28px 22px 22px;
    border-radius: 22px; border: 1px solid var(--line);
    background: rgba(26, 15, 20, .82);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 0 80px rgba(242, 123, 165, .22);
    opacity: 0; transform: translateY(22px);
    animation: rise .7s cubic-bezier(.2, .7, .2, 1) .1s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card.shake { animation: shake .4s ease; opacity: 1; transform: none; }
  @keyframes shake {
    20% { transform: translateX(-8px); } 40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(3px); }
  }
  h1 { margin: 0; text-align: center; font: 700 32px/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.3px; }
  .lead { margin: 8px 0 22px; text-align: center; color: var(--muted); }

  label { display: block; margin: 0 2px 6px; font-size: 13px; font-weight: 650; color: var(--muted); }
  .field {
    display: flex; align-items: center; gap: 8px; min-height: 54px; margin-bottom: 16px; padding: 0 6px 0 16px;
    border-radius: 14px; background: var(--field); border: 1px solid transparent;
    transition: border-color .15s ease;
  }
  .field:focus-within { border-color: var(--rose); }
  .field output, .field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font: inherit;
  }
  .field output { font-family: ui-monospace, "Roboto Mono", monospace; letter-spacing: .08em; overflow-wrap: anywhere; }
  .field input::placeholder { color: #8a7480; }
  .mini {
    flex: none; min-width: 44px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px;
    background: none; color: var(--rose); font: inherit; font-size: 14px; font-weight: 650;
  }
  .mini:active { background: rgba(242, 123, 165, .14); }
  .mini svg { width: 22px; height: 22px; fill: currentColor; display: block; margin: auto; }

  .note { min-height: 22px; margin: -4px 2px 14px; font-size: 14px; color: var(--muted); }
  .note.bad { color: var(--bad); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 54px; border: 0; border-radius: 14px;
    font: inherit; font-size: 17px; font-weight: 750; color: #2a0f1a;
    background: linear-gradient(180deg, #ff9dbf, var(--rose));
    box-shadow: 0 10px 28px rgba(242, 123, 165, .32);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.98); filter: brightness(1.08); }
  .btn[disabled] { opacity: .7; }
  .btn.second {
    margin-top: 12px; color: var(--ink); font-weight: 650;
    background: rgba(255, 255, 255, .06); border: 1px solid var(--line); box-shadow: none;
  }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%; display: none;
    border: 2.5px solid rgba(42, 15, 26, .25); border-top-color: #2a0f1a; animation: spin .8s linear infinite;
  }
  .busy .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 15px; }
  .foot button { border: 0; background: none; padding: 8px 4px; color: var(--rose); font: inherit; font-weight: 700; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 5; transform: translate(-50%, 20px); opacity: 0;
    padding: 10px 16px; border-radius: 999px; font-size: 14px; background: var(--ink); color: #2a0f1a;
    transition: opacity .2s ease, transform .2s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .lamp, .cone, .card { animation: none; }
    .card { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="cone" aria-hidden="true"></div>
<div class="lamp" aria-hidden="true"></div>
<canvas id="dust" aria-hidden="true"></canvas>

<main>
  <form class="card" id="card" autocomplete="off">
    <h1>Hoş geldin</h1>
    <p class="lead">Işığı takip et, hesabına ulaş.</p>

    <label for="device">Cihaz Kimliği</label>
    <div class="field">
      <output id="device">…</output>
      <button class="mini" type="button" id="copy" aria-label="Kimliği kopyala">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
    </div>

    <label for="password">Şifre</label>
    <div class="field">
      <input id="password" type="password" placeholder="Şifreni gir" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="mini" type="button" id="reveal">Göster</button>
    </div>

    <p class="note" id="note" role="status"></p>

    <button class="btn" type="submit" id="login"><span class="spinner"></span><span id="loginText">Giriş yap</span></button>
    <button class="btn second" type="button" id="telegram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.800.8l-4.800-3.600-2.300 2.300c-.3.3-.5.500-1 .5l.300-4.900 9-8.100c.4-.300-.100-.5-.6-.2L6.400 13.300 1.700 11.800c-1-.3-1-1 .2-1.500L20.500 3.100c.9-.3 1.600.2 1.400 1.200z"/></svg>
      Telegram
    </button>

    <p class="foot">Şifren yok mu? <button type="button" id="send">Kimliğini gönder</button></p>
  </form>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var MESSAGES = {
    NOT_REGISTERED: "Bu cihaz henüz tanımlı değil. Kimliğini gönder, tanımlandıktan sonra tekrar dene.",
    PASSWORD_NEEDED: "",
    WRONG_PASSWORD: "Şifre hatalı.",
    SUSPENDED: "Hesabın kapatılmış. Telegram'dan ulaşabilirsin.",
    EXPIRED: "Süren doldu. Yenilemek için Telegram'dan ulaşabilirsin.",
    NO_CONNECTION: "Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene."
  };

  // In a normal browser there is no app behind the page, a stand-in keeps it usable for design work
  var access = window.Access || {
    info: function () { return JSON.stringify({ deviceId: "1e256221b241974e", reason: null }); },
    login: function () { setTimeout(function () { window.onAccessResult("WRONG_PASSWORD"); }, 700); },
    retry: function () { this.login(); }, openTelegram: function () {}, sendId: function () {}
  };
  var app = window.CloudStream;

  var card = document.getElementById('card');
  var note = document.getElementById('note');
  var password = document.getElementById('password');
  var loginButton = document.getElementById('login');
  var toastEl = document.getElementById('toast');
  var deviceId = "", toastTimer = 0;

  function toast(text) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  function showReason(reason, isAnswer) {
    var text = reason ? (MESSAGES[reason] || "Giriş yapılamadı.") : "";
    note.textContent = text;
    // Being asked for a password is not an error yet
    note.className = 'note' + (text && reason !== 'PASSWORD_NEEDED' ? ' bad' : '');
    document.getElementById('loginText').textContent = reason === 'NO_CONNECTION' ? "Tekrar dene" : "Giriş yap";
    if (isAnswer && text) {
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }
  }

  function refresh() {
    var info = {};
    try { info = JSON.parse(access.info()) || {}; } catch (e) {}
    deviceId = info.deviceId || "";
    document.getElementById('device').textContent = deviceId || "—";
    showReason(info.reason, false);
  }

  function setBusy(busy) {
    loginButton.disabled = busy;
    loginButton.classList.toggle('busy', busy);
  }

  window.onAccessState = refresh;
  window.onAccessResult = function (reason) {
    setBusy(false);
    if (reason) showReason(reason, true);
    // Without a reason the door is open and the app closes this page
  };

  card.addEventListener('submit', function (event) {
    event.preventDefault();
    if (loginButton.disabled) return;
    setBusy(true);
    note.textContent = ""; note.className = 'note';
    // Never leave the button waiting for good if the app does not answer
    setTimeout(function () { setBusy(false); }, 20000);
    try { access.login(password.value); } catch (e) { setBusy(false); }
  });

  document.getElementById('reveal').addEventListener('click', function () {
    var hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    this.textContent = hidden ? "Gizle" : "Göster";
  });
  document.getElementById('copy').addEventListener('click', function () {
    try {
      if (app && app.copy) app.copy(deviceId);
      else if (navigator.clipboard) navigator.clipboard.writeText(deviceId);
      toast("Kimlik kopyalandı");
    } catch (e) {}
  });
  document.getElementById('telegram').addEventListener('click', function () { try { access.openTelegram(); } catch (e) {} });
  document.getElementById('send').addEventListener('click', function () { try { access.sendId(); } catch (e) {} });

  refresh();

  // Dust in the light
  var canvas = document.getElementById('dust'), ctx = canvas.getContext('2d');
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var motes = [], width = 0, height = 0;
  function resize() {
    var ratio = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    motes = [];
    for (var i = 0; i < 26; i++) {
      motes.push({ x: width * (.2 + Math.random() * .6), y: Math.random() * height * .7, r: Math.random() * 1.6 + .5,
        vy: Math.random() * .18 + .04, sway: Math.random() * Math.PI * 2 });
    }
  }
  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      if (!still) { m.y += m.vy; m.x += Math.sin(time / 1700 + m.sway) * .12; if (m.y > height * .72) m.y = -4; }
      ctx.globalAlpha = .28 + .5 * Math.abs(Math.sin(time / 1300 + m.sway));
      ctx.fillStyle = '#ffe3ee';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }
  window.addEventListener('resize', function () { resize(); if (still) draw(0); });
  resize();
  if (still) draw(0); else requestAnimationFrame(draw);
})();
</script>
</body>
</html>
