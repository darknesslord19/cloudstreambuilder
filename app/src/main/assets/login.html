<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giriş</title>
<!--
  Erişim listesi açıkken uygulamanın başında gösterilen giriş sayfası.
  Renkler uygulamanın temasından gelir (Access.theme()), gelmezse aşağıdaki varsayılanlar kullanılır.
  Uygulamaya: Access.info(), Access.login(sifre), Access.openTelegram(), Access.sendId()
  Uygulamadan: window.onAccessResult(neden | null), window.onAccessState()
-->
<style>
  :root {
    --bg: #111114;
    --card: #1c1c20;
    --field: #26262b;
    --line: rgba(255, 255, 255, .08);
    --ink: #f4f4f6;
    --muted: #9c9ca6;
    --accent: #e8365d;
    --accent-2: #ff7a93;
    --accent-a12: rgba(232, 54, 93, .12);
    --accent-a16: rgba(232, 54, 93, .16);
    --accent-a22: rgba(232, 54, 93, .22);
    --accent-a32: rgba(232, 54, 93, .32);
    --accent-a45: rgba(232, 54, 93, .45);
    --alert-ink: #ff9fb1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    background:
      radial-gradient(120% 55% at 50% 0%, var(--accent-a16), transparent 70%),
      var(--bg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { min-height: 100%; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); padding: 28px 16px; }

  @media (max-width: 380px) { .card { padding: 28px 18px 24px; } .field { padding-left: 16px; } }
  .card {
    width: 100%; min-width: 0; justify-self: center; max-width: 420px; padding: 34px 26px 28px;
    border-radius: 28px; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 30px 70px rgba(0, 0, 0, .45);
    opacity: 0; transform: translateY(18px);
    animation: rise .6s cubic-bezier(.2, .7, .2, 1) .05s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card.shake { animation: shake .4s ease; opacity: 1; transform: none; }
  @keyframes shake {
    20% { transform: translateX(-8px); } 40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(3px); }
  }

  h1 { margin: 0 0 28px; text-align: center; font-size: 34px; font-weight: 800; letter-spacing: -.5px; }

  label { display: block; margin: 0 2px 10px; font-size: 15px; color: var(--muted); }
  .field {
    display: flex; align-items: center; gap: 8px; min-height: 58px; margin-bottom: 22px; padding: 0 8px 0 20px;
    border-radius: 18px; background: var(--field); border: 1px solid var(--line);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-a22); }
  .field output, .field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; font-size: 17px;
  }
  .field output { font-family: ui-monospace, "Roboto Mono", monospace; letter-spacing: .06em; font-size: clamp(14px, 4.3vw, 17px); overflow-wrap: anywhere; }
  .field input::placeholder { color: var(--muted); opacity: .75; }
  .mini {
    flex: none; min-width: 44px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px;
    background: none; color: var(--accent); font: inherit; font-size: 15px; font-weight: 650;
  }
  .mini:active { background: var(--accent-a12); }
  .mini svg { width: 24px; height: 24px; display: block; margin: auto; }

  .alert {
    display: none; align-items: center; gap: 14px; margin: -4px 0 22px; padding: 14px 18px;
    border-radius: 18px; color: var(--alert-ink);
    background: var(--accent-a12);
    border: 1px solid var(--accent-a45);
    font-size: 15px;
  }
  .alert.show { display: flex; }
  .alert.info { color: var(--muted); background: var(--field); border-color: var(--line); }
  .alert svg { flex: none; width: 24px; height: 24px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; min-height: 58px; border: 0; border-radius: 18px;
    font: inherit; font-size: 18px; font-weight: 700; color: #fff;
    background: linear-gradient(110deg, var(--accent-2), var(--accent));
    box-shadow: 0 14px 30px var(--accent-a32);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.98); filter: brightness(1.08); }
  .btn[disabled] { opacity: .75; }
  .btn.second {
    margin-top: 16px; background: none; box-shadow: none; border: 1px solid var(--line); color: var(--ink);
  }
  .tg { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .tg svg { width: 18px; height: 18px; fill: #111; margin-left: -2px; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%; display: none;
    border: 2.5px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .8s linear infinite;
  }
  .busy .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot { margin: 28px 0 0; text-align: center; color: var(--muted); font-size: 16px; }
  .foot button { border: 0; background: none; padding: 8px 2px; color: var(--accent); font: inherit; font-weight: 700; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
    padding: 10px 16px; border-radius: 999px; font-size: 14px; background: var(--ink); color: var(--bg);
    transition: opacity .2s ease, transform .2s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<main>
  <form class="card" id="card" autocomplete="off">
    <h1>Hoş geldin</h1>

    <label for="device">Cihaz Kimliği</label>
    <div class="field">
      <output id="device">…</output>
      <button class="mini" type="button" id="copy" aria-label="Kimliği kopyala">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2"/></svg>
      </button>
    </div>

    <label for="password">Şifre</label>
    <div class="field">
      <input id="password" type="password" placeholder="Şifreni gir" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="mini" type="button" id="reveal">Göster</button>
    </div>

    <div class="alert" id="alert" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>
      <span id="alertText"></span>
    </div>

    <button class="btn" type="submit" id="login"><span class="spinner"></span><span id="loginText">Giriş yap</span></button>
    <button class="btn second" type="button" id="telegram">
      <span class="tg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.8-3.6-2.3 2.3c-.3.3-.5.5-1 .5l.3-4.9 9-8.1c.4-.3-.1-.5-.6-.2L6.4 13.3 1.7 11.8c-1-.3-1-1 .2-1.5L20.5 3.1c.9-.3 1.6.2 1.4 1.2z"/></svg></span>
      Telegram
    </button>

    <p class="foot">Şifren yok mu? <button type="button" id="send">Kimliğini gönder</button></p>
  </form>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="theme.js"></script>
<script>
(function () {
  var MESSAGES = {
    NOT_REGISTERED: "Bu cihaz henüz tanımlı değil. Kimliğini gönder, tanımlandıktan sonra tekrar dene.",
    WRONG_PASSWORD: "Giriş yapılamadı. Lütfen bilgilerinizi kontrol edin.",
    SUSPENDED: "Hesabın kapatılmış. Telegram'dan ulaşabilirsin.",
    EXPIRED: "Süren doldu. Yenilemek için Telegram'dan ulaşabilirsin.",
    NO_CONNECTION: "Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene."
  };

  // In a normal browser there is no app behind the page, a stand-in keeps it usable for design work
  var access = window.Access || {
    info: function () { return JSON.stringify({ deviceId: "14147d0155f3a4b5", reason: null }); },
    theme: function () { return "{}"; },
    login: function () { setTimeout(function () { window.onAccessResult("WRONG_PASSWORD"); }, 700); },
    openTelegram: function () {}, sendId: function () {}
  };
  var app = window.CloudStream;

  // The colours of the app theme. An accent too close to the background keeps the default.
  applyTheme(access);

  var card = document.getElementById('card');
  var alertBox = document.getElementById('alert');
  var password = document.getElementById('password');
  var loginButton = document.getElementById('login');
  var toastEl = document.getElementById('toast');
  var deviceId = "", toastTimer = 0;

  function toast(text) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  function showReason(reason, isAnswer) {
    var text = reason && reason !== 'PASSWORD_NEEDED' ? (MESSAGES[reason] || "Giriş yapılamadı.") : "";
    document.getElementById('alertText').textContent = text;
    alertBox.className = 'alert' + (text ? ' show' : '') + (reason === 'NOT_REGISTERED' ? ' info' : '');
    document.getElementById('loginText').textContent = reason === 'NO_CONNECTION' ? "Tekrar dene" : "Giriş yap";
    if (isAnswer && text) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  }

  function refresh() {
    var info = {};
    try { info = JSON.parse(access.info()) || {}; } catch (e) {}
    deviceId = info.deviceId || "";
    document.getElementById('device').textContent = deviceId || "—";
    showReason(info.reason, false);
  }

  function setBusy(busy) { loginButton.disabled = busy; loginButton.classList.toggle('busy', busy); }

  window.onAccessState = refresh;
  window.onAccessResult = function (reason) { setBusy(false); if (reason) showReason(reason, true); };

  card.addEventListener('submit', function (event) {
    event.preventDefault();
    if (loginButton.disabled) return;
    setBusy(true);
    alertBox.className = 'alert';
    // Never leave the button waiting for good if the app does not answer
    setTimeout(function () { setBusy(false); }, 20000);
    try { access.login(password.value); } catch (e) { setBusy(false); }
  });

  document.getElementById('reveal').addEventListener('click', function () {
    var hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    this.textContent = hidden ? "Gizle" : "Göster";
  });
  document.getElementById('copy').addEventListener('click', function () {
    try {
      if (app && app.copy) app.copy(deviceId);
      else if (navigator.clipboard) navigator.clipboard.writeText(deviceId);
      toast("Kimlik kopyalandı");
    } catch (e) {}
  });
  document.getElementById('telegram').addEventListener('click', function () { try { access.openTelegram(); } catch (e) {} });
  document.getElementById('send').addEventListener('click', function () { try { access.sendId(); } catch (e) {} });

  refresh();
})();
</script>
</body>
</html>
