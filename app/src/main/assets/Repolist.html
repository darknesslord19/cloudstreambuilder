<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depo listesi</title>
<!--
  "Depo ekle" penceresindeki "Depo listesi" düğmesi bu sayfayı tam ekran açar.

  Liste iki yerden okunur:
    1. GitHub: PRIMARY_URL ({ "repos": [ { name, url, category, favorite } ] })
    2. Firebase: FALLBACK_URL ([ { name, url, source } ])
  GitHub okunursa ondaki depolar gösterilir, yalnızca Firebase'de olanlar da eklenir.
  GitHub okunamazsa liste tamamen Firebase'den gelir. İkisi de okunamazsa son başarılı liste
  (bu cihazda saklanan) gösterilir.

  Adresi manifest.json ile biten depolar "Nuvio" sekmesinde (Nuvio ve Stremio eklentileri),
  diğerleri "CloudStream" sekmesinde listelenir.

  Uygulamaya: CloudStream.addRepository(url, name), addedRepositories(), allowedTypes(), copy(), close()
-->
<style>
  :root {
    --bg: #1C1216; --card: #26181E; --field: #2F1E25; --line: rgba(248, 232, 238, .10);
    --ink: #F8E8EE; --muted: #B58C9B; --accent: #F27BA5; --accent-2: #f9a8c6;
    --accent-a12: rgba(242, 123, 165, .12); --accent-a16: rgba(242, 123, 165, .16);
    --accent-a22: rgba(242, 123, 165, .22); --accent-a32: rgba(242, 123, 165, .32); --accent-a45: rgba(242, 123, 165, .45);
    --ok: #34d399; --star: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink);
    background: radial-gradient(120% 40% at 50% 0%, var(--accent-a16), transparent 70%), var(--bg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input { font: inherit; color: inherit; }

  /* ---------- top bar ---------- */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 18px; }
  .bar h1 { flex: 1; margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.2px; }
  .icon-btn {
    width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(255, 255, 255, .04); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 21px; height: 21px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 14px 12px; padding: 5px; border-radius: 16px; background: var(--field); border: 1px solid var(--line); }
  .tab {
    border: 0; border-radius: 12px; background: none; min-height: 42px; font-weight: 700; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s ease, color .2s ease;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: #2a0f1a; }
  .tab .n { font-size: 12px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: rgba(0, 0, 0, .18); }

  main { max-width: 620px; margin: 0 auto; padding: 14px 14px 40px; }
  .search {
    display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px;
    background: var(--field); border: 1px solid var(--line); margin-bottom: 12px;
  }
  .search:focus-within { border-color: var(--accent); }
  .search svg { width: 19px; height: 19px; color: var(--muted); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; }
  .search input::placeholder { color: var(--muted); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 7px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 650;
    color: var(--muted); background: transparent; border: 1px solid var(--line); cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: #2a0f1a; background: var(--accent); border-color: var(--accent); }

  .status { display: flex; align-items: center; gap: 8px; margin: 0 2px 12px; color: var(--muted); font-size: 12.5px; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .status.warn i { background: var(--star); }

  .list { display: grid; gap: 10px; }
  .repo {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
    padding: 14px 14px 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--card);
    opacity: 0; transform: translateY(10px); animation: rise .45s cubic-bezier(.2, .7, .2, 1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .repo .name { font-size: 16px; font-weight: 750; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .repo .star { color: var(--star); font-size: 14px; }
  .repo .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .repo .url { grid-column: 1; color: color-mix(in srgb, var(--muted) 80%, transparent); font-size: 12px; overflow-wrap: anywhere; }
  .actions { grid-column: 2; grid-row: 1 / span 3; display: grid; gap: 7px; }
  .btn {
    min-width: 88px; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 0; cursor: pointer;
    font-weight: 750; color: #2a0f1a; background: linear-gradient(135deg, var(--accent-2), var(--accent));
    box-shadow: 0 6px 18px var(--accent-a22); transition: transform .12s ease;
  }
  .btn:active { transform: scale(.95); }
  .btn.ghost { color: var(--ink); background: rgba(255, 255, 255, .05); border: 1px solid var(--line); box-shadow: none; font-weight: 600; }
  .btn.done { color: var(--ok); background: rgba(52, 211, 153, .10); border: 1px solid rgba(52, 211, 153, .35); box-shadow: none; }

  .empty { text-align: center; color: var(--muted); padding: 50px 14px; }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
  .skeleton { height: 86px; border-radius: 18px; background: linear-gradient(90deg, var(--card), var(--field), var(--card)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .toast {
    position: fixed; left: 50%; bottom: 26px; z-index: 9; transform: translate(-50%, 20px); opacity: 0;
    padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--ink); color: var(--bg);
    transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .repo, .skeleton, .icon-btn.spin svg { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <h1>Depo listesi</h1>
    <button class="icon-btn" id="refresh" aria-label="Listeyi güncelle" title="Listeyi güncelle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="close" aria-label="Kapat" title="Kapat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="cloudstream" aria-selected="true">CloudStream <span class="n" id="nCs">0</span></button>
    <button class="tab" role="tab" data-tab="nuvio" aria-selected="false">Nuvio <span class="n" id="nNu">0</span></button>
  </div>
</div>

<main>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Depo ara" autocomplete="off">
  </label>
  <div class="chips" id="chips" role="group" aria-label="Kategori"></div>
  <div class="status" id="status"><i></i><span>Yükleniyor…</span></div>
  <div class="list" id="list"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="theme.js"></script>
<script>
(function () {
  // ----------------------------------------------------------------------------------------
  var PRIMARY_URL = "https://raw.githubusercontent.com/liberta09/CloudStreamRepoManager/main/central_repos.json";
  var FALLBACK_URL = "https://devilx-6769b-default-rtdb.firebaseio.com/repos.json";
  var TIMEOUT_MS = 10000;
  var CACHE_KEY = "repolist-cache-v1";
  // ----------------------------------------------------------------------------------------

  var app = window.CloudStream;
  try { if (window.applyTheme && app && app.theme) applyTheme(app); } catch (e) {}

  var canAdd = false, added = [], allowed = null;
  try { canAdd = !!(app && app.canAddRepository && app.canAddRepository()); } catch (e) {}
  try { if (app && app.addedRepositories) added = JSON.parse(app.addedRepositories()) || []; } catch (e) {}
  try { if (app && app.allowedTypes) allowed = JSON.parse(app.allowedTypes()); } catch (e) {}
  var nuvioAllowed = !allowed || allowed.indexOf('nuvio') !== -1 || allowed.indexOf('stremio') !== -1;

  var listEl = document.getElementById('list');
  var chipsEl = document.getElementById('chips');
  var statusEl = document.getElementById('status');
  var refreshBtn = document.getElementById('refresh');
  var toastEl = document.getElementById('toast');
  var query = document.getElementById('q');
  var tab = "cloudstream", category = "all", repos = [], toastTimer = 0, loading = false;

  function toast(text) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // "TÜRKÇE", "Türkçe" and "türkçe" are one category, as are "HİNT" and "HİNTÇE"
  var CATEGORY_NAMES = { "türkçe": "Türkçe", "ingilizce": "İngilizce", "hint": "Hintçe", "hintçe": "Hintçe", "spor": "Spor",
    "italyanca": "İtalyanca", "almanca": "Almanca", "vietnamca": "Vietnamca", "fransızca": "Fransızca" };
  function categoryOf(text) {
    var key = String(text || "").trim().toLocaleLowerCase('tr-TR');
    if (!key) return "";
    return CATEGORY_NAMES[key] || key.charAt(0).toLocaleUpperCase('tr-TR') + key.slice(1);
  }
  function kindOf(url) {
    var path = url.split('#')[0].split('?')[0].toLowerCase();
    return /manifest\.json$/.test(path) ? "nuvio" : "cloudstream";
  }
  function normalizeUrl(url) { return String(url || "").trim().replace(/\/+$/, ""); }

  /** Entries of either document, as { name, url, category, favorite, kind }. */
  function entriesOf(data) {
    var list = data && !Array.isArray(data) && Array.isArray(data.repos) ? data.repos : data;
    if (list && !Array.isArray(list) && typeof list === 'object') list = Object.keys(list).map(function (k) { return list[k]; });
    if (!Array.isArray(list)) return [];
    var out = [];
    list.forEach(function (item) {
      if (!item || typeof item.url !== 'string') return;
      var url = item.url.trim();
      if (!/^(https?|stremio|skystream):\/\//i.test(url)) return;
      out.push({
        name: String(item.name || url).trim(),
        url: url,
        category: categoryOf(item.category),
        favorite: item.favorite === true,
        kind: kindOf(url)
      });
    });
    return out;
  }

  function fetchJson(url) {
    var controller = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (controller) controller.abort(); }, TIMEOUT_MS);
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    return fetch(url + sep + '_=' + Date.now(), { cache: 'no-store', signal: controller ? controller.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) { clearTimeout(timer); return json; }, function (e) { clearTimeout(timer); throw e; });
  }

  function merge(primary, extra) {
    var seen = {}, out = [];
    primary.concat(extra).forEach(function (r) {
      var key = normalizeUrl(r.url).toLowerCase();
      if (seen[key]) return;
      seen[key] = true; out.push(r);
    });
    return out;
  }

  function setStatus(text, warn) {
    statusEl.className = 'status' + (warn ? ' warn' : '');
    statusEl.lastChild.textContent = text;
  }

  function load(byUser) {
    if (loading) return;
    loading = true;
    refreshBtn.classList.add('spin');
    if (!repos.length) showSkeleton();
    Promise.all([
      fetchJson(PRIMARY_URL).then(entriesOf, function () { return null; }),
      fetchJson(FALLBACK_URL).then(entriesOf, function () { return null; })
    ]).then(function (results) {
      var gh = results[0], fb = results[1];
      var list, text, warn = false;
      if (gh && gh.length) {
        list = merge(gh, fb || []);
        text = "GitHub" + (fb && fb.length ? " + Firebase" : "") + " · " + list.length + " depo";
      } else if (fb && fb.length) {
        list = fb; warn = true;
        text = "GitHub'a ulaşılamadı, Firebase kullanılıyor · " + list.length + " depo";
      } else {
        list = readCache(); warn = true;
        text = list.length ? "Bağlantı yok, son kaydedilen liste gösteriliyor" : "Liste alınamadı. İnternetini kontrol edip güncelle düğmesine bas.";
      }
      if (list.length && (gh || fb)) writeCache(list);
      repos = list;
      setStatus(text, warn);
      render();
      if (byUser) toast(list.length ? "Liste güncellendi" : "Liste alınamadı");
    }).then(function () {
      loading = false; refreshBtn.classList.remove('spin');
    });
  }

  function readCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || []; } catch (e) { return []; } }
  function writeCache(list) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); } catch (e) {} }

  function showSkeleton() {
    listEl.textContent = "";
    for (var i = 0; i < 5; i++) listEl.appendChild(el('div', 'skeleton'));
  }

  function inTab() { return repos.filter(function (r) { return r.kind === tab; }); }

  function renderChips(items) {
    chipsEl.textContent = "";
    var counts = {};
    items.forEach(function (r) { if (r.category) counts[r.category] = (counts[r.category] || 0) + 1; });
    var names = Object.keys(counts).sort(function (a, b) {
      // Turkish first, then by how many repositories a category has
      if (a === "Türkçe") return -1; if (b === "Türkçe") return 1;
      return counts[b] - counts[a];
    });
    if (category !== "all" && !counts[category]) category = "all";
    if (names.length < 2) return;
    [["all", "Tümü"]].concat(names.map(function (n) { return [n, n]; })).forEach(function (pair) {
      var chip = el('button', 'chip', pair[1]);
      chip.type = 'button';
      chip.setAttribute('aria-pressed', String(category === pair[0]));
      chip.addEventListener('click', function () { category = pair[0]; render(); });
      chipsEl.appendChild(chip);
    });
  }

  function render() {
    var cs = repos.filter(function (r) { return r.kind === "cloudstream"; }).length;
    var nu = repos.length - cs;
    document.getElementById('nCs').textContent = cs;
    document.getElementById('nNu').textContent = nu;

    var items = inTab();
    renderChips(items);
    var q = query.value.trim().toLocaleLowerCase('tr-TR');
    var shown = items.filter(function (r) {
      if (category !== "all" && r.category !== category) return false;
      return !q || (r.name + " " + r.url).toLocaleLowerCase('tr-TR').indexOf(q) !== -1;
    }).sort(function (a, b) { return (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0); });

    listEl.textContent = "";
    if (!shown.length) {
      var empty = el('div', 'empty');
      empty.appendChild(el('b', null, q ? "Sonuç yok" : "Bu listede depo yok"));
      empty.appendChild(document.createTextNode(q ? "Başka bir şey aramayı dene." : "Güncelle düğmesiyle listeyi yeniden yükleyebilirsin."));
      listEl.appendChild(empty);
      return;
    }
    shown.forEach(function (repo, index) {
      var card = el('article', 'repo');
      card.style.animationDelay = Math.min(index * 35, 350) + 'ms';

      var name = el('div', 'name');
      if (repo.favorite) name.appendChild(el('span', 'star', '★'));
      name.appendChild(document.createTextNode(repo.name));
      card.appendChild(name);
      if (repo.category) {
        var meta = el('div', 'meta');
        meta.appendChild(el('span', 'tag', repo.category));
        card.appendChild(meta);
      }
      card.appendChild(el('div', 'url', repo.url));

      var actions = el('div', 'actions');
      var isAdded = added.some(function (u) { return normalizeUrl(u) === normalizeUrl(repo.url); });
      if (isAdded) {
        var done = el('button', 'btn done', "Eklendi"); done.type = 'button'; done.disabled = true;
        actions.appendChild(done);
      } else if (canAdd) {
        var add = el('button', 'btn', "Ekle"); add.type = 'button';
        add.addEventListener('click', function () { app.addRepository(repo.url, repo.name); });
        actions.appendChild(add);
      }
      var copy = el('button', 'btn ghost', "Kopyala"); copy.type = 'button';
      copy.addEventListener('click', function () {
        try {
          if (app && app.copy) app.copy(repo.url); else if (navigator.clipboard) navigator.clipboard.writeText(repo.url);
          toast("Adres kopyalandı");
        } catch (e) {}
      });
      actions.appendChild(copy);
      card.appendChild(actions);
      listEl.appendChild(card);
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (button) {
    if (button.dataset.tab === 'nuvio' && !nuvioAllowed) { button.hidden = true; button.parentNode.style.gridTemplateColumns = '1fr'; }
    button.addEventListener('click', function () {
      tab = button.dataset.tab; category = "all";
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.setAttribute('aria-selected', String(b === button)); });
      window.scrollTo(0, 0);
      render();
    });
  });
  query.addEventListener('input', render);
  refreshBtn.addEventListener('click', function () { load(true); });
  document.getElementById('close').addEventListener('click', function () { if (app && app.close) app.close(); else window.close(); });

  // What was there last time is shown at once, the fresh list replaces it
  repos = readCache();
  if (repos.length) render();
  load(false);
})();
</script>
</body>
</html>
