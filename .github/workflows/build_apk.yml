name: Build APK

# Builds the installable APK without needing any secrets, so it also works in a fork.
# It runs on every push to the "eklentili" branch and can be started from the "Actions" tab.
# The APK is published as a release ("Releases" page of the repository) and is also attached
# to the finished run.
on:
  push:
    branches: [ eklentili ]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build that is still running
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The build number of the app, the update check compares it with "version_code"
      FORK_BUILD_NUMBER: ${{ github.run_number }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    # Plus > VPN: the official Xray program (pinned version) for ARM phones and TVs. It is packed
    # as lib/<abi>/libxray.so, so Android installs it as a file the app may run.
    - name: Download the VPN core
      run: |
        set -e
        XRAY=v26.9.30
        get() {
          curl -fL --retry 3 -o "/tmp/$1.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY}/$1.zip"
          rm -rf "/tmp/$1" && mkdir -p "/tmp/$1" && unzip -q "/tmp/$1.zip" -d "/tmp/$1"
          mkdir -p "app/src/main/jniLibs/$2"
          cp "/tmp/$1/xray" "app/src/main/jniLibs/$2/libxray.so"
        }
        get Xray-android-arm64-v8a arm64-v8a
        get Xray-linux-arm32-v7a armeabi-v7a
        ls -la app/src/main/jniLibs/*/

    # Plus > VPN > DPI aşma: ByeDPI (hufrea/byedpi, a small SOCKS program, packed as libciadpi.so
    # so it may be run) and hev-socks5-tunnel (heiher, the VPN for the whole phone), pinned versions,
    # built with the Android NDK of the runner.
    - name: Build the DPI bypass
      run: |
        set -eo pipefail
        {
        NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
        echo "NDK: $NDK"
        TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
        OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs"
        git clone -q https://github.com/hufrea/byedpi /tmp/byedpi
        git -C /tmp/byedpi checkout -q ba532298de7b28cfe854aea83d061369d13ca290
        byedpi() {
          mkdir -p "$OUT/$2"
          (cd /tmp/byedpi && "$TC/$1-clang" -std=c99 -O2 -D_DEFAULT_SOURCE -I. $(ls *.c | grep -v win_service) \
            -Wl,-z,max-page-size=16384 -o "$OUT/$2/libciadpi.so")
        }
        byedpi aarch64-linux-android21 arm64-v8a
        byedpi armv7a-linux-androideabi21 armeabi-v7a
        git clone -q https://github.com/heiher/hev-socks5-tunnel /tmp/hev
        git -C /tmp/hev checkout -q 4d6c334dbfb68a79d1970c2744e62d09f71df12f
        git -C /tmp/hev submodule update --init --recursive -q
        mkdir -p /tmp/hevmk
        printf '%s\n' 'APP_OPTIM := release' 'APP_PLATFORM := android-21' 'APP_ABI := armeabi-v7a arm64-v8a' \
          'APP_CFLAGS := -O3 -DPKGNAME=com/lagradost/cloudstream3/fork/vpn -DCLSNAME=HevTunnel' \
          'NDK_TOOLCHAIN_VERSION := clang' 'APP_LDFLAGS := -Wl,-z,max-page-size=16384' > /tmp/hevmk/Application.mk
        "$NDK/ndk-build" -j4 NDK_PROJECT_PATH=/tmp/hevbuild APP_BUILD_SCRIPT=/tmp/hev/Android.mk \
          NDK_APPLICATION_MK=/tmp/hevmk/Application.mk NDK_LIBS_OUT=/tmp/hevlibs
        for abi in arm64-v8a armeabi-v7a; do cp "/tmp/hevlibs/$abi/libhev-socks5-tunnel.so" "$OUT/$abi/"; done
        ls -la "$OUT"/*/
        } 2>&1 | tee build.log

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build
      run: |
        set -o pipefail
        ./gradlew assembleStableRelease 2>&1 | tee build.log

    # The errors of a failed build, where they can be read without opening the run
    - name: Publish the log of a failed build
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        grep -n -E "^e: |error:|FAILED|What went wrong|Caused by" build.log | head -200 > build-errors.txt || true
        tail -n 120 build.log >> build-errors.txt || true
        gh release view build-log --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create build-log --repo "${GITHUB_REPOSITORY}" --prerelease --target "${GITHUB_SHA}" \
            --title "Derleme günlüğü" --notes "Başarısız olan son derlemenin hata çıktısı."
        gh release upload build-log build-errors.txt --repo "${GITHUB_REPOSITORY}" --clobber

    - name: Name the APK
      run: |
        mkdir -p out
        cp app/build/outputs/apk/stable/release/*.apk "out/CloudStream-${FORK_BUILD_NUMBER}.apk"
        ls -la out

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: cloudstream-apk
        path: out/*.apk

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${FORK_BUILD_NUMBER}/CloudStream-${FORK_BUILD_NUMBER}.apk"
        VERSION_NAME="$(grep -E '^versionName' gradle/libs.versions.toml | cut -d'"' -f2)"
        {
          echo "Sürüm ${FORK_BUILD_NUMBER} (${GITHUB_SHA::7})"
          echo
          echo "Uygulama içi güncellemeyi duyurmak için güncelleme adresine yazılacak içerik:"
          echo
          echo '```json'
          echo '{'
          echo "  \"version_code\": ${FORK_BUILD_NUMBER},"
          echo "  \"version_name\": \"${VERSION_NAME}\","
          echo '  "title": "Yeni Güncelleme Mevcut!",'
          echo '  "message": "Yeni özellikler ekledik ve hataları düzelttik.",'
          echo '  "changelog": ["Hata düzeltmeleri", "Performans iyileştirmeleri"],'
          echo "  \"update_url\": \"${APK_URL}\","
          echo '  "force": false,'
          echo '  "show": true'
          echo '}'
          echo '```'
        } > notes.md
        gh release create "v${FORK_BUILD_NUMBER}" "out/CloudStream-${FORK_BUILD_NUMBER}.apk" \
          --repo "${GITHUB_REPOSITORY}" \
          --target "${GITHUB_SHA}" \
          --title "Sürüm ${FORK_BUILD_NUMBER}" \
          --notes-file notes.md
