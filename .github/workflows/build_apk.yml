name: Build APK

# Builds an installable debug APK without needing any secrets, so it also works in a fork.
# It runs on every push to the "eklentili" branch and can be started from the "Actions" tab,
# the APK is attached to the finished run.
on:
  push:
    branches: [ eklentili ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build
      run: ./gradlew assemblePrereleaseDebug

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: cloudstream-apk
        path: "app/build/outputs/apk/prerelease/debug/*.apk"
